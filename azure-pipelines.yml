trigger:
  - main

pr:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  mavenPomFile: spring-boot-web-app/pom.xml
  javaVersion: "21"
  azureSubscription: AzureServiceConnection
  resourceGroup: rg-spring-boot
  webAppNameDev: springboot-sanjay0303-dev
  webAppNameProd: springboot-sanjay0303
  dockerRegistryServiceConnection: AzureContainerRegistryConnection
  imageRepository: spring-boot-web-app

stages:
  - stage: Build
    displayName: Build Spring Boot app
    jobs:
      - job: MavenBuild
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: $(javaVersion)
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Maven@4
            inputs:
              mavenPomFile: $(mavenPomFile)
              goals: "clean package"
              options: "-B"
              javaHomeOption: JDKVersion
              jdkVersionOption: "1.21"
              publishJUnitResults: true
              testResultsFiles: "**/surefire-reports/TEST-*.xml"

          - task: CopyFiles@2
            inputs:
              SourceFolder: spring-boot-web-app/target
              Contents: "spring-boot-web-app-*.jar"
              TargetFolder: $(Build.ArtifactStagingDirectory)

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: drop

      - job: DockerBuild
        displayName: Build and push Docker image
        condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
        steps:
          - task: Docker@2
            displayName: Build and push to ACR
            inputs:
              command: buildAndPush
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: $(imageRepository)
              Dockerfile: spring-boot-web-app/Dockerfile
              buildContext: spring-boot-web-app
              tags: |
                $(Build.BuildId)
                latest

  - stage: DeployDev
    displayName: Deploy to Dev
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDevWeb
        environment: development
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: AzureCLI@2
                  displayName: Deploy JAR to Dev App Service
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      APP_NAME=$(webAppNameDev)
                      az webapp config set \
                        --name "$APP_NAME" \
                        --resource-group $(resourceGroup) \
                        --linux-fx-version "JAVA|21-java21"
                      az webapp config appsettings set \
                        --name "$APP_NAME" \
                        --resource-group $(resourceGroup) \
                        --settings CURRENT_STACK=java WEBSITES_PORT=8080 JAVA_OPTS="-Xms128m -Xmx256m"
                      JAR=$(ls $(Pipeline.Workspace)/drop/spring-boot-web-app-*.jar | head -n 1)
                      echo "Deploying $JAR to $APP_NAME"
                      az webapp deploy \
                        --name "$APP_NAME" \
                        --resource-group $(resourceGroup) \
                        --src-path "$JAR" \
                        --type jar

  - stage: DeployProd
    displayName: Deploy to Production
    dependsOn: DeployDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProdWeb
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: AzureCLI@2
                  displayName: Deploy JAR to Production App Service
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      APP_NAME=$(webAppNameProd)
                      az webapp config set \
                        --name "$APP_NAME" \
                        --resource-group $(resourceGroup) \
                        --linux-fx-version "JAVA|21-java21"
                      az webapp config appsettings set \
                        --name "$APP_NAME" \
                        --resource-group $(resourceGroup) \
                        --settings CURRENT_STACK=java WEBSITES_PORT=8080 JAVA_OPTS="-Xms128m -Xmx256m"
                      JAR=$(ls $(Pipeline.Workspace)/drop/spring-boot-web-app-*.jar | head -n 1)
                      echo "Deploying $JAR to $APP_NAME"
                      az webapp deploy \
                        --name "$APP_NAME" \
                        --resource-group $(resourceGroup) \
                        --src-path "$JAR" \
                        --type jar
