trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  mavenPomFile: spring-boot-web-app/pom.xml
  javaVersion: "21"
  azureSubscription: AzureServiceConnection
  webAppName: springboot-sanjay0303

stages:
  - stage: Build
    displayName: Build Spring Boot app
    jobs:
      - job: MavenBuild
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: $(javaVersion)
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Maven@4
            inputs:
              mavenPomFile: $(mavenPomFile)
              goals: "clean package"
              options: "-B"
              javaHomeOption: JDKVersion
              jdkVersionOption: "1.21"
              publishJUnitResults: true
              testResultsFiles: "**/surefire-reports/TEST-*.xml"

          - task: CopyFiles@2
            inputs:
              SourceFolder: spring-boot-web-app/target
              Contents: "spring-boot-web-app-*.jar"
              TargetFolder: $(Build.ArtifactStagingDirectory)

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: drop

  - stage: Deploy
    displayName: Deploy to Azure App Service (F1)
    dependsOn: Build
    jobs:
      - deployment: DeployWeb
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webAppLinux
                    appName: $(webAppName)
                    package: $(Pipeline.Workspace)/drop/*.jar
                    runtimeStack: "JAVA:21-java21"
