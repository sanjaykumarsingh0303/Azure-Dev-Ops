trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  mavenPomFile: spring-boot-web-app/pom.xml
  javaVersion: "21"
  azureSubscription: AzureServiceConnection
  webAppName: springboot-sanjay0303
  resourceGroup: rg-spring-boot

stages:
  - stage: Build
    displayName: Build Spring Boot app
    jobs:
      - job: MavenBuild
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: $(javaVersion)
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Maven@4
            inputs:
              mavenPomFile: $(mavenPomFile)
              goals: "clean package"
              options: "-B"
              javaHomeOption: JDKVersion
              jdkVersionOption: "1.21"
              publishJUnitResults: true
              testResultsFiles: "**/surefire-reports/TEST-*.xml"

          - task: CopyFiles@2
            inputs:
              SourceFolder: spring-boot-web-app/target
              Contents: "spring-boot-web-app-*.jar"
              TargetFolder: $(Build.ArtifactStagingDirectory)

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: drop

      - job: DockerBuild
        displayName: Build Docker image
        steps:
          - task: Docker@2
            displayName: docker build
            inputs:
              command: build
              Dockerfile: spring-boot-web-app/Dockerfile
              buildContext: spring-boot-web-app
              repository: spring-boot-web-app
              tags: $(Build.BuildId)

  - stage: Deploy
    displayName: Deploy to Azure App Service (F1)
    dependsOn: Build
    jobs:
      - deployment: DeployWeb
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: AzureCLI@2
                  displayName: Deploy JAR to App Service
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      az webapp config set \
                        --name $(webAppName) \
                        --resource-group $(resourceGroup) \
                        --linux-fx-version "JAVA|21-java21"

                      az webapp config appsettings set \
                        --name $(webAppName) \
                        --resource-group $(resourceGroup) \
                        --settings CURRENT_STACK=java WEBSITES_PORT=8080 JAVA_OPTS="-Xms128m -Xmx256m"

                      JAR=$(ls $(Pipeline.Workspace)/drop/spring-boot-web-app-*.jar | head -n 1)
                      echo "Deploying $JAR"

                      az webapp deploy \
                        --name $(webAppName) \
                        --resource-group $(resourceGroup) \
                        --src-path "$JAR" \
                        --type jar
